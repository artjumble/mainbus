appId: app.mainbus
productName: Mainbus
directories:
  buildResources: build
  output: dist
files:
  - out/**
  # The CLI runs outside the asar, from resources/cli (below).
  - "!out/cli/**"
  - package.json
  # Mainbus runs the user's own `claude` (pathToClaudeCodeExecutable), so the Agent SDK's bundled per-platform binary
  # packages (about 288 MB) are never used. The hyphen keeps @anthropic-ai/claude-agent-sdk itself.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*{,/**}"
win:
  target: dir
  # The exe's icon. build/ is the packager's alone: the running app loads its icons from resources/icons (below).
  icon: build/icon.ico
mac:
  target:
    - target: dir
      arch: [arm64]
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Ad-hoc signing: runs on the Mac that built it, needs no Apple account.
  identity: "-"
  # Ad-hoc signing with the hardened runtime needs extra entitlements; signing and notarization turn it on with them.
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Mainbus uses the microphone for voice dictation, transcribed on this Mac.
linux:
  target: [deb, AppImage]
  # The app's own command. /usr/bin/mainbus is the CLI (build/linux/mainbus), so the app can't take that name.
  executableName: mainbus-app
  # 1024x1024; electron-builder makes the hicolor sizes from it.
  icon: build/icon.png
  category: Development
  synopsis: Run Claude Code agents against a ticket board
  maintainer: Mainbus
  # The desktop file is app.mainbus.desktop (desktopName in package.json): Electron's app_id, which the launcher badge
  # and the window grouping match against.
  syncDesktopName: true
deb:
  fpm:
    # Adds the CLI to the package as /usr/bin/mainbus. The deb's own link is /usr/bin/mainbus-app.
    - build/linux/mainbus=/usr/bin/mainbus
extraResources:
  - from: src/engine/db/migrations
    to: migrations
  - from: out/cli
    to: cli
  # The window, tray and notification icons, rendered from design/icons by `pnpm icons:build`.
  - from: resources/icons
    to: icons
