# Type check and unit tests on Windows, macOS and Linux for every pull request.
#
# All three platforms must pass the unit tests and the Linux end-to-end tests; the macOS end-to-end job is
# non-blocking. Test results are uploaded as artifacts for each.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-latest }
    defaults:
      run:
        shell: bash
    steps:
      # The Windows runner's default temp folder is an 8.3 short path (C:\Users\RUNNER~1\...), which the engine's
      # workspace checks don't treat as the same folder as its long form. runner.temp is already long.
      # (The runner context isn't available in a job-level env, so it is set from a step.)
      - name: Use the long temp folder
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Windows runners default to core.autocrlf=true, which turns test fixtures' LF into CRLF.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm exec vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.name }}
          path: test-results/
          if-no-files-found: warn

  # The end-to-end tests on Linux, under a virtual display. Bare Xvfb has no window manager, so minimize and maximize
  # would do nothing: openbox supplies one.
  e2e-linux:
    name: E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces Electron's sandbox needs when it runs from node_modules.
      - name: Allow Electron's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install a window manager
        run: sudo apt-get update && sudo apt-get install -y openbox
      - run: pnpm build
      # main has an intermittent e2e failure, so one retry in CI.
      - name: End-to-end tests
        run: xvfb-run -a sh -c 'openbox & exec pnpm exec playwright test --retries=1'
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-Linux
          path: test-results/
          if-no-files-found: warn

  # The end-to-end tests on macOS. Non-blocking while the macOS port is young: a failure here doesn't fail the
  # workflow. macOS runners have a window server, so there is no virtual display or window manager to set up.
  e2e-macos:
    name: E2E (macOS)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The runner's screen size limits how large the app window can be, so the log shows it.
      - name: Show the display size
        continue-on-error: true
        run: pnpm exec electron e2e/displaySize.cjs || true
      - name: End-to-end tests
        run: pnpm exec playwright test --retries=1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-macOS
          path: test-results/
          if-no-files-found: warn

  # Builds the deb and the AppImage, installs the deb, checks it, and runs the packaged tests on both. Its own job, not a
  # matrix entry of `package`: the steps differ too much.
  package-linux:
    name: Package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package
        run: pnpm exec electron-builder --linux deb AppImage
      # libfuse2t64 is for running the AppImage; openbox gives the virtual display a window manager.
      - name: Install the deb
        run: sudo apt-get update && sudo apt-get install -y ./dist/mainbus_*_amd64.deb desktop-file-utils libfuse2t64 openbox
      - name: Check the deb
        run: |
          # The runner restricts unprivileged user namespaces, as Ubuntu 24.04 does. The deb's AppArmor profile must lift it
          # for the app, so the tests below prove the sandbox works with the restriction on.
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          desktop=/usr/share/applications/app.mainbus.desktop
          desktop-file-validate "$desktop"
          grep -qx 'Icon=mainbus-app' "$desktop"
          grep -qx 'StartupWMClass=app.mainbus' "$desktop"
          ls /usr/share/icons/hicolor/*/apps/mainbus-app.png
          test -x /usr/bin/mainbus
          command -v mainbus-app
          test -f /etc/apparmor.d/mainbus-app
      - name: Installed deb test
        run: >
          MAINBUS_E2E_PACKAGED=/opt/Mainbus/mainbus-app MAINBUS_E2E_CLI=mainbus
          xvfb-run -a sh -c 'openbox & exec pnpm exec playwright test e2e/packaged.spec.ts --retries=1'
      # An AppImage can carry neither the SUID sandbox (it mounts nosuid) nor an AppArmor profile, so it needs unprivileged
      # user namespaces. This comes after the deb test, which needs the restriction on.
      - name: AppImage test
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          chmod +x dist/*.AppImage
          appimage=$(ls "$PWD"/dist/*.AppImage)
          MAINBUS_E2E_PACKAGED="$appimage" xvfb-run -a sh -c 'openbox & exec pnpm exec playwright test e2e/packaged.spec.ts --retries=1'
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results-Linux
          path: test-results/
          if-no-files-found: warn

  # Builds the unpacked package on Windows and macOS (arm64), checks it, and runs a scripted agent through the packaged app.
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: win, exe: dist/win-unpacked/Mainbus.exe }
          - { name: macOS, os: macos-latest, target: mac, exe: dist/mac-arm64/Mainbus.app/Contents/MacOS/Mainbus }
    defaults:
      run:
        shell: bash
    steps:
      - name: Use the long temp folder
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package
        run: pnpm exec electron-builder --${{ matrix.target }} dir
      - name: Check the macOS bundle
        if: matrix.target == 'mac'
        run: |
          app=dist/mac-arm64/Mainbus.app
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
          plutil -extract NSMicrophoneUsageDescription raw "$app/Contents/Info.plist"
          icon=$(plutil -extract CFBundleIconFile raw "$app/Contents/Info.plist")
          case "$icon" in *.icns) ;; *) icon="$icon.icns" ;; esac
          test -s "$app/Contents/Resources/$icon"
          file "$app/Contents/MacOS/Mainbus" | grep -q arm64
      - name: Packaged app test
        run: MAINBUS_E2E_PACKAGED="$PWD/${{ matrix.exe }}" pnpm exec playwright test e2e/packaged.spec.ts --retries=1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results-${{ matrix.name }}
          path: test-results/
          if-no-files-found: warn
