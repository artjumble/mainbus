# Publishes site/ (the marketing site for mainbus.app) to GitHub Pages.
#
# It only runs when started by hand (Actions → "Publish mainbus.app" → Run workflow): nothing deploys on a push.
# Before the first run, set Settings → Pages → Source to "GitHub Actions" and the custom domain to mainbus.app.
# site/README.md has the DNS records and how to add a push trigger if you want one.
name: Publish mainbus.app

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run waits rather than cancelling one under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site is plain HTML and CSS with its images committed: there is no build step.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
